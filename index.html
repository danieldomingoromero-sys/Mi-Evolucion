<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#7b2034"><title>Mi Evolución</title><style>*{box-sizing:border-box}body{margin:0;background:#faf3f4;color:#42232d;font:15px system-ui,Arial}header{background:linear-gradient(125deg,#85283f,#ac4862);color:white;padding:22px 18px 28px;border-radius:0 0 25px 25px}h1{font-size:25px;margin:0}header p{margin:6px 0 0;opacity:.9}.wrap{max-width:750px;margin:auto;padding:15px 14px 95px}.card{background:white;border-radius:18px;padding:17px;margin:0 0 14px;box-shadow:0 2px 12px #75273c12}h2{font-size:19px;margin:0 0 13px}h3{font-size:16px;margin:12px 0 7px}.muted{color:#8b6972;font-size:13px}.big{font-size:31px;font-weight:800;color:#7b2034}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#f9e9ed;border-radius:13px;padding:12px}.stat b{font-size:20px;display:block}label{display:block;margin:10px 0 5px;font-weight:600;font-size:13px}input,select{width:100%;border:1px solid #e7cdd3;border-radius:10px;padding:12px;background:white;color:#4b2933;font:inherit;min-width:0}button{border:0;border-radius:11px;padding:12px 14px;font:inherit;font-weight:700;cursor:pointer;background:#922b45;color:white}button.secondary{background:#f9e6eb;color:#852840}button.danger{background:#fff0ee;color:#aa3b32}.row{display:flex;align-items:center;justify-content:space-between;gap:9px}.row>*{min-width:0}.stack{display:grid;gap:9px}.tabs{position:fixed;bottom:0;left:0;right:0;background:white;display:flex;justify-content:space-around;box-shadow:0 -3px 16px #4d293219;padding:7px 2px calc(8px + env(safe-area-inset-bottom));z-index:10}.tabs button{font-size:11px;background:transparent;color:#8b6972;padding:7px 2px;flex:1;line-height:1.5}.tabs button.active{color:#8a2941;background:#f9e6eb}.tabs span{display:block;font-size:19px}.bar{background:#f4e6e9;border-radius:20px;height:12px;overflow:hidden;margin:9px 0}.bar div{background:#a73a55;height:100%;border-radius:20px}.item{border-bottom:1px solid #f6e8eb;padding:11px 0}.item:last-child{border:0}.pill{font-size:12px;background:#f9e6eb;padding:5px 9px;border-radius:30px;color:#82263d}.hide{display:none!important}svg{max-width:100%;height:auto}.note{background:#f9e9ed;padding:12px;border-radius:12px;font-size:13px}.smallbtn{padding:7px 9px;font-size:12px}#toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);background:#542735;color:white;padding:11px 18px;border-radius:12px;display:none;z-index:20;white-space:nowrap}input[type=date]{min-height:44px}</style><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon-192.png" type="image/png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"></head><body><header><h1>🌿 Mi Evolución</h1><p>Un día a la vez · Tu bienestar, tu ritmo</p></header><main class="wrap"><section id="inicio"></section><section id="comidas" class="hide"></section><section id="dieta" class="hide"></section><section id="progreso" class="hide"></section><section id="ajustes" class="hide"></section></main><nav class="tabs"><button data-tab="inicio" class="active"><span>🏠</span>Inicio</button><button data-tab="comidas"><span>🥗</span>Comidas</button><button data-tab="dieta"><span>👨‍🍳</span>Mi dieta</button><button data-tab="progreso"><span>📈</span>Progreso</button><button data-tab="ajustes"><span>⚙️</span>Ajustes</button></nav><div id="toast"></div><script>
const KEY='mi_evolucion_v1';const today=()=>new Date().toLocaleDateString('sv-SE');const base={settings:{start:89,target:73,kcal:1900,protein:140,carbs:195,fat:62},foods:[],weights:[],custom:[]};let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(base)}catch(e){db=structuredClone(base)};db.settings||=base.settings;db.foods||=[];db.weights||=[];db.custom||=[];let selected=today(),chartMode='peso',active='inicio';const $=id=>document.getElementById(id),money=n=>Number(n).toLocaleString('es-ES',{maximumFractionDigits:1}),num=x=>Number(x)||0,esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('No se pudieron guardar los datos. Exporta una copia de seguridad.')}}function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2300)}function tab(t){active=t;document.querySelectorAll('main section').forEach(x=>x.classList.toggle('hide',x.id!==t));document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));render();scrollTo(0,0)}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>tab(b.dataset.tab));function totals(d){return db.foods.filter(x=>x.date===d).reduce((a,x)=>{a.kcal+=x.kcal;a.p+=x.p;a.c+=x.c;a.f+=x.f;return a},{kcal:0,p:0,c:0,f:0})}function latest(){return [...db.weights].sort((a,b)=>b.date.localeCompare(a.date))[0]}function progress(n,max){return `<div class="bar"><div style="width:${Math.max(0,Math.min(100,max?100*n/max:0))}%"></div></div>`}function render(){if(active==='inicio')home();if(active==='comidas')foodPage();if(active==='dieta')dietPage();if(active==='progreso')progressPage();if(active==='ajustes')settingsPage()}
function home(){const t=totals(selected),s=db.settings,w=latest();$('inicio').innerHTML=`<div class="card"><div class="row"><h2>📅 Resumen diario</h2><input style="width:160px" type="date" id="homeDate" value="${selected}"></div><div class="big">${money(t.kcal)} <small style="font-size:15px">/ ${money(s.kcal)} kcal</small></div>${progress(t.kcal,s.kcal)}<p class="muted">${t.kcal<=s.kcal?money(s.kcal-t.kcal)+' kcal disponibles':money(t.kcal-s.kcal)+' kcal por encima del objetivo'}</p><div class="grid"><div class="stat">Proteínas <b>${money(t.p)} / ${s.protein} g</b>${progress(t.p,s.protein)}</div><div class="stat">Hidratos <b>${money(t.c)} / ${s.carbs} g</b>${progress(t.c,s.carbs)}</div><div class="stat">Grasas <b>${money(t.f)} / ${s.fat} g</b>${progress(t.f,s.fat)}</div><div class="stat">Peso actual <b>${w?money(w.peso):'89'} kg</b><small class="muted">Meta ${s.target} kg</small></div></div></div><div class="card"><h2>🎯 Tu objetivo</h2><div class="row"><div><span class="muted">Inicio</span><div class="big">${money(s.start)} kg</div></div><div>→</div><div><span class="muted">Meta</span><div class="big">${money(s.target)} kg</div></div></div><p class="muted">${w?'Cambio registrado: '+money(w.peso-s.start)+' kg desde el inicio.':'Registra tu primer peso en Progreso.'}</p></div><div class="card"><h2>Accesos rápidos</h2><div class="grid"><button onclick="tab('comidas')">＋ Añadir comida</button><button class="secondary" onclick="tab('progreso')">＋ Registrar peso</button></div></div>`;$('homeDate').onchange=e=>{selected=e.target.value;render()}}
const catalog=[['Huevo',143,12.6,.7,9.5],['Pechuga de pollo cocinada',165,31,0,3.6],['Arroz blanco cocido',130,2.7,28.2,.3],['Pasta cocida',158,5.8,30.9,.9],['Patata cocida',87,1.9,20.1,.1],['Pan integral',247,13,41,4.2],['Aceite de oliva',884,0,0,100],['Plátano',89,1.1,22.8,.3],['Manzana',52,.3,13.8,.2],['Yogur natural',63,3.5,4.7,3.3],['Avena',389,16.9,66.3,6.9],['Leche semidesnatada',46,3.4,4.8,1.6],['Atún al natural',116,25.5,0,.8],['Lentejas cocidas',116,9,20,.4],['Garbanzos cocidos',164,8.9,27.4,2.6],['Merluza',82,17.8,0,.7],['Tomate',18,.9,3.9,.2],['Almendras',579,21.2,21.6,49.9],['Queso fresco batido 0%',46,8,4,0],['Pavo cocido',135,29,0,1.6]];let chosen=null;function foodPage(){const t=totals(selected);$('comidas').innerHTML=`<div class="card"><div class="row"><h2>🥗 Diario de comidas</h2><input id="foodDate" type="date" style="width:160px" value="${selected}"></div><p><b>${money(t.kcal)} kcal</b> registradas · ${db.foods.filter(x=>x.date===selected).length} alimentos</p><label>Buscar alimento (catálogo sin conexión)</label><input id="searchFood" placeholder="Ej. pollo, arroz, yogur..."><div id="results"></div><div class="note" style="margin-top:10px">Los valores del catálogo son aproximados por 100 g. Comprueba la etiqueta del producto concreto. Puedes crear tus propios alimentos.</div></div><div class="card"><h2>➕ Añadir alimento</h2><div class="stack"><label>Nombre<input id="fName" placeholder="Nombre del alimento"></label><div class="grid"><label>Cantidad (g)<input id="fGrams" type="number" value="100" min="1"></label><label>Momento<select id="fMeal"><option>Desayuno</option><option>Comida</option><option>Merienda</option><option>Cena</option><option>Otros</option></select></label></div><p class="muted">Valores por 100 g (también puedes escribirlos manualmente)</p><div class="grid"><label>Kcal<input id="fK" type="number" min="0" step="any"></label><label>Proteína (g)<input id="fP" type="number" min="0" step="any"></label><label>Hidratos (g)<input id="fC" type="number" min="0" step="any"></label><label>Grasas (g)<input id="fF" type="number" min="0" step="any"></label></div><button id="addFood">Guardar en diario</button><button class="secondary" id="saveFood">Guardar alimento personalizado</button></div></div><div class="card"><h2>📋 Comidas del día</h2><div id="foodList"></div></div>`;$('foodDate').onchange=e=>{selected=e.target.value;render()};$('searchFood').oninput=e=>showResults(e.target.value);$('addFood').onclick=()=>addFood(false);$('saveFood').onclick=()=>addFood(true);listFoods()}
function showResults(q){if(!q.trim()){$('results').innerHTML='';return}const all=[...db.custom.map(x=>[x.name,x.k,x.p,x.c,x.f]),...catalog];$('results').innerHTML=all.filter(x=>x[0].toLowerCase().includes(q.toLowerCase())).slice(0,8).map(x=>`<button class="secondary smallbtn" style="margin:5px 5px 0 0" data-name="${esc(x[0])}">${esc(x[0])}</button>`).join('')||'<p class="muted">No aparece. Puedes añadirlo manualmente.</p>';$('results').querySelectorAll('button').forEach(b=>b.onclick=()=>{let x=all.find(x=>x[0]===b.dataset.name);$('fName').value=x[0];$('fK').value=x[1];$('fP').value=x[2];$('fC').value=x[3];$('fF').value=x[4];toast('Alimento seleccionado')})}
function addFood(custom){let name=$('fName').value.trim(),g=num($('fGrams').value),k=num($('fK').value),p=num($('fP').value),c=num($('fC').value),f=num($('fF').value);if(!name||g<=0||[k,p,c,f].some(x=>x<0)){alert('Revisa el nombre, la cantidad y los valores.');return}if(custom){db.custom.push({name,k,p,c,f});save();toast('Alimento guardado');return}let factor=g/100;db.foods.push({id:Date.now()+Math.random(),date:selected,meal:$('fMeal').value,name,grams:g,kcal:k*factor,p:p*factor,c:c*factor,f:f*factor});save();foodPage();toast('Comida registrada')}
function listFoods(){$('foodList').innerHTML=db.foods.filter(x=>x.date===selected).map(x=>`<div class="item row"><div><b>${esc(x.name)}</b><div class="muted">${esc(x.meal)} · ${money(x.grams)} g · ${money(x.p)} g proteína</div></div><div style="text-align:right"><b>${money(x.kcal)} kcal</b><br><button class="danger smallbtn" data-del="${x.id}">Eliminar</button></div></div>`).join('')||'<p class="muted">Aún no hay comidas registradas.</p>';$('foodList').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('¿Eliminar este alimento?')){db.foods=db.foods.filter(x=>String(x.id)!==b.dataset.del);save();foodPage()}})}
const recipes=[{name:'Avena con yogur y plátano',meal:'Desayuno',items:[['Avena',55],['Yogur natural',200],['Plátano',120]]},{name:'Tostadas con huevo y tomate',meal:'Desayuno',items:[['Pan integral',80],['Huevo',120],['Tomate',100]]},{name:'Arroz con pollo y verduras',meal:'Comida',items:[['Arroz blanco cocido',200],['Pechuga de pollo cocinada',180],['Tomate',120],['Aceite de oliva',10]]},{name:'Lentejas con atún',meal:'Comida',items:[['Lentejas cocidas',250],['Atún al natural',100],['Tomate',120],['Aceite de oliva',10]]},{name:'Pasta con atún y tomate',meal:'Comida',items:[['Pasta cocida',220],['Atún al natural',120],['Tomate',150],['Aceite de oliva',10]]},{name:'Yogur, manzana y almendras',meal:'Merienda',items:[['Yogur natural',200],['Manzana',180],['Almendras',20]]},{name:'Queso fresco batido y plátano',meal:'Merienda',items:[['Queso fresco batido 0%',250],['Plátano',120]]},{name:'Merluza con patata',meal:'Cena',items:[['Merluza',220],['Patata cocida',300],['Tomate',150],['Aceite de oliva',10]]},{name:'Pollo con patata y tomate',meal:'Cena',items:[['Pechuga de pollo cocinada',180],['Patata cocida',250],['Tomate',150],['Aceite de oliva',10]]},{name:'Ensalada de garbanzos y atún',meal:'Cena',items:[['Garbanzos cocidos',200],['Atún al natural',100],['Tomate',150],['Aceite de oliva',10]]}];const days=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];const menus=[[0,2,5,7],[1,3,6,8],[0,4,5,9],[1,2,6,7],[0,3,5,8],[1,4,6,9],[0,2,5,7]];function rStats(r){return r.items.reduce((a,[name,g])=>{let v=catalog.find(x=>x[0]===name),z=g/100;a.k+=v[1]*z;a.p+=v[2]*z;a.c+=v[3]*z;a.f+=v[4]*z;return a},{k:0,p:0,c:0,f:0})}let dayIndex=0;function dietPage(){$('dieta').innerHTML=`<div class="card"><h2>👨‍🍳 Dieta recomendada</h2><p class="muted">Menú orientativo con cantidades por ración. No es obligatorio seguirlo al pie de la letra. Ajusta las porciones según tu hambre y necesidades.</p><label>Selecciona el día</label><select id="dayPick">${days.map((d,i)=>`<option value="${i}" ${i===dayIndex?'selected':''}>${d}</option>`).join('')}</select><div id="menuDay"></div></div><div class="card"><h2>🛒 Lista de la compra orientativa</h2><p class="muted">Cantidades aproximadas para una persona, basadas en este menú de ejemplo. Comprueba precios y alimentos disponibles.</p><div id="shopping"></div><button class="secondary" id="copyShop">Copiar lista</button></div><div class="card note">Las recetas son ejemplos y sus valores se estiman con una tabla genérica. Las calorías reales cambian según marca, cocción y cantidades. Puedes registrar cada receta en tu diario y modificarla después.</div>`;$('dayPick').onchange=e=>{dayIndex=+e.target.value;menuDay()};menuDay();let shopping={};menus.forEach(day=>day.forEach(i=>recipes[i].items.forEach(([n,g])=>shopping[n]=(shopping[n]||0)+g)));const txt=Object.entries(shopping).map(([n,g])=>`${n}: ${g} g`).join('\n');$('shopping').innerHTML=Object.entries(shopping).map(([n,g])=>`<div class="item row"><span>${esc(n)}</span><b>${g} g</b></div>`).join('');$('copyShop').onclick=()=>{if(navigator.clipboard?.writeText)navigator.clipboard.writeText(txt).then(()=>toast('Lista copiada')).catch(()=>toast('No se pudo copiar'));else alert(txt)}}function menuDay(){let ids=menus[dayIndex],total=ids.reduce((a,i)=>a+rStats(recipes[i]).k,0);$('menuDay').innerHTML=ids.map(i=>{let r=recipes[i],v=rStats(r);return `<div class="item"><div class="row"><div><span class="pill">${r.meal}</span><h3>${esc(r.name)}</h3></div><b>${Math.round(v.k)} kcal</b></div><div class="muted">${r.items.map(([n,g])=>esc(n)+' '+g+' g').join(' · ')}</div><p class="muted">P ${money(v.p)} g · HC ${money(v.c)} g · G ${money(v.f)} g</p><button class="secondary smallbtn" data-recipe="${i}">Añadir al diario</button></div>`}).join('')+`<div class="row" style="padding-top:12px"><b>Total del menú</b><b>${Math.round(total)} kcal</b></div><p class="muted">Objetivo: ${db.settings.kcal} kcal. Ajusta raciones o añade alimentos según sea necesario.</p>`;$('menuDay').querySelectorAll('[data-recipe]').forEach(b=>b.onclick=()=>{let r=recipes[+b.dataset.recipe];r.items.forEach(([name,g])=>{let x=catalog.find(x=>x[0]===name),z=g/100;db.foods.push({id:Date.now()+Math.random(),date:selected,meal:r.meal,name,grams:g,kcal:x[1]*z,p:x[2]*z,c:x[3]*z,f:x[4]*z})});save();toast('Receta añadida al día '+selected)})}
function progressPage(){let sorted=[...db.weights].sort((a,b)=>a.date.localeCompare(b.date));$('progreso').innerHTML=`<div class="card"><h2>📏 Peso y medidas</h2><label>Fecha<input type="date" id="wDate" value="${selected}"></label><div class="grid"><label>Peso (kg)<input type="number" step="0.1" min="1" id="wPeso" placeholder="89"></label><label>Cintura (cm)<input type="number" step="0.1" min="1" id="wCintura" placeholder="110"></label><label>Pecho (cm)<input type="number" step="0.1" min="1" id="wPecho"></label><label>Cadera (cm)<input type="number" step="0.1" min="1" id="wCadera"></label><label>Brazo (cm)<input type="number" step="0.1" min="1" id="wBrazo"></label><label>Muslo (cm)<input type="number" step="0.1" min="1" id="wMuslo"></label></div><button style="margin-top:12px;width:100%" id="saveWeight">Guardar registro</button></div><div class="card"><h2>📈 Gráfico de evolución</h2><select id="chartMode"><option value="peso">Peso (kg)</option><option value="cintura">Cintura (cm)</option><option value="pecho">Pecho (cm)</option><option value="cadera">Cadera (cm)</option><option value="brazo">Brazo (cm)</option><option value="muslo">Muslo (cm)</option></select><div id="chart"></div></div><div class="card"><h2>📅 Historial de medidas</h2><div id="weightList"></div></div>`;$('chartMode').value=chartMode;$('chartMode').onchange=e=>{chartMode=e.target.value;drawChart()};$('wDate').onchange=e=>fillWeight(e.target.value);fillWeight(selected);$('saveWeight').onclick=()=>{let d=$('wDate').value,fields=['peso','cintura','pecho','cadera','brazo','muslo'];if(!d){alert('Indica la fecha');return}let r={date:d};fields.forEach(k=>{let v=$('w'+k[0].toUpperCase()+k.slice(1)).value;r[k]=v===''?null:Number(v)});if(fields.every(k=>r[k]===null)||fields.some(k=>r[k]!==null&&(!Number.isFinite(r[k])||r[k]<=0))){alert('Introduce al menos una medida válida');return}let idx=db.weights.findIndex(x=>x.date===d);if(idx>=0)db.weights[idx]={...db.weights[idx],...Object.fromEntries(fields.filter(k=>r[k]!==null).map(k=>[k,r[k]]))};else db.weights.push(r);save();progressPage();toast('Medidas guardadas')};drawChart();$('weightList').innerHTML=sorted.reverse().map(x=>`<div class="item row"><div><b>${esc(x.date)}</b><div class="muted">${['peso','cintura','pecho','cadera','brazo','muslo'].filter(k=>x[k]!=null).map(k=>k+': '+money(x[k])+(k==='peso'?' kg':' cm')).join(' · ')}</div></div><button class="danger smallbtn" data-wdel="${x.date}">Borrar</button></div>`).join('')||'<p class="muted">Registra tus medidas para ver la evolución.</p>';$('weightList').querySelectorAll('[data-wdel]').forEach(b=>b.onclick=()=>{if(confirm('¿Borrar este registro?')){db.weights=db.weights.filter(x=>x.date!==b.dataset.wdel);save();progressPage()}})}function fillWeight(d){let x=db.weights.find(x=>x.date===d);['peso','cintura','pecho','cadera','brazo','muslo'].forEach(k=>$('w'+k[0].toUpperCase()+k.slice(1)).value=x?.[k]??'')}function drawChart(){let pts=[...db.weights].filter(x=>x[chartMode]!=null).sort((a,b)=>a.date.localeCompare(b.date));if(!pts.length){$('chart').innerHTML='<p class="muted">Añade registros para visualizar el gráfico.</p>';return}let vals=pts.map(x=>x[chartMode]),lo=Math.min(...vals),hi=Math.max(...vals),pad=Math.max(1,(hi-lo)*.2),min=lo-pad,max=hi+pad;let W=340,H=195,coords=pts.map((x,i)=>[28+(pts.length===1?W/2-28:i*(W-50)/(pts.length-1)),H-27-(x[chartMode]-min)/(max-min)*(H-45)]),poly=coords.map(p=>p.join(',')).join(' ');$('chart').innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de ${chartMode}"><line x1="28" y1="10" x2="28" y2="168" stroke="#e5cbd1"/><line x1="28" y1="168" x2="325" y2="168" stroke="#e5cbd1"/><text x="0" y="18" font-size="11" fill="#8b6972">${money(max)}</text><text x="0" y="165" font-size="11" fill="#8b6972">${money(min)}</text><polyline points="${poly}" fill="none" stroke="#922b45" stroke-width="3" stroke-linejoin="round"/>${coords.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#922b45"><title>${pts[i].date}: ${pts[i][chartMode]}</title></circle>`).join('')}<text x="28" y="188" font-size="11" fill="#8b6972">${pts[0].date}</text><text x="325" y="188" text-anchor="end" font-size="11" fill="#8b6972">${pts.at(-1).date}</text></svg><p class="muted">${pts.length} registros · Primero ${money(vals[0])} · Último ${money(vals.at(-1))}</p>`}
function settingsPage(){let s=db.settings;$('ajustes').innerHTML=`<div class="card"><h2>⚙️ Mis objetivos</h2><div class="grid"><label>Peso inicial (kg)<input id="sStart" type="number" step="0.1" value="${s.start}"></label><label>Meta (kg)<input id="sTarget" type="number" step="0.1" value="${s.target}"></label><label>Kcal diarias<input id="sKcal" type="number" value="${s.kcal}"></label><label>Proteínas (g)<input id="sProtein" type="number" value="${s.protein}"></label><label>Hidratos (g)<input id="sCarbs" type="number" value="${s.carbs}"></label><label>Grasas (g)<input id="sFat" type="number" value="${s.fat}"></label></div><button style="width:100%;margin-top:12px" id="saveSettings">Guardar objetivos</button></div><div class="card"><h2>💾 Copias de seguridad</h2><p class="muted">Tus datos se guardan en este navegador y dispositivo. Exporta una copia periódicamente y guárdala en Drive desde el menú de compartir o Archivos. No hay sincronización automática.</p><div class="stack"><button id="export">Descargar copia JSON</button><label class="secondary">Restaurar copia JSON<input type="file" id="import" accept=".json,application/json"></label></div></div><div class="card note">Esta app es una herramienta personal de seguimiento, no un dispositivo médico. El objetivo de 1.900 kcal es una estimación inicial; ajusta con un profesional si aparecen síntomas, fatiga importante o necesidades médicas específicas. El buscador incorporado es un catálogo local, no una base de datos online.</div>`;$('saveSettings').onclick=()=>{let keys=['start','target','kcal','protein','carbs','fat'],o={};for(let k of keys){o[k]=num($('s'+k[0].toUpperCase()+k.slice(1)).value);if(o[k]<=0){alert('Los objetivos deben ser positivos');return}}db.settings=o;save();toast('Objetivos guardados')};$('export').onclick=()=>{let blob=new Blob([JSON.stringify({app:'Mi Evolución',version:1,exported:new Date().toISOString(),data:db},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='Mi_Evolucion_copia_'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('import').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let parsed=JSON.parse(await file.text()),d=parsed.data||parsed;if(!d.settings||!Array.isArray(d.foods)||!Array.isArray(d.weights)||!Array.isArray(d.custom))throw Error('Formato no válido');if(confirm('Esto reemplazará los registros actuales. ¿Continuar?')){db=d;save();render();toast('Copia restaurada')}}catch(e){alert('No se pudo restaurar: '+e.message)}}}
